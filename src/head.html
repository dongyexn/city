<title>픽셀 도시</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* layout: full-bleed isometric map; frosted-glass panels float over the city at the corners */
:root{
  --bg:#1a2330; --glass:rgba(255,255,255,.44); --glass2:rgba(255,255,255,.22); --glass-brd:rgba(255,255,255,.62); --glass-hi:rgba(255,255,255,.8);
  --solid:#f4f7fa; --ink:#0d1620; --muted:#34424f; --line:rgba(20,40,60,.16); --chip:rgba(255,255,255,.42); --chip-on:rgba(255,255,255,.9);
  --accent:#1f5fd1; --accent-soft:rgba(31,95,209,.16); --on-map:#f2f6fa; --shadow:rgba(8,18,30,.26); --toast-bg:rgba(13,22,32,.78); --toast-fg:#f4f7fa;
  --zr:#2f9e4f; --zc:#2f86d6; --zi:#d4930f; --warn:#c2412d;
  --f-display:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151d; --glass:rgba(18,24,34,.52); --glass2:rgba(18,24,34,.3); --glass-brd:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.12);
  --solid:#151b24; --ink:#eef3f8; --muted:#b6c2ce; --line:rgba(255,255,255,.13); --chip:rgba(255,255,255,.08); --chip-on:rgba(255,255,255,.22);
  --accent:#7aa7f5; --accent-soft:rgba(122,167,245,.2); --on-map:#f2f6fa; --shadow:rgba(0,0,0,.45); --toast-bg:rgba(240,245,250,.86); --toast-fg:#0d1620;
  --zr:#4cc06a; --zc:#57a3ea; --zi:#e8ad34; --warn:#ef6f5b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151d; --glass:rgba(18,24,34,.52); --glass2:rgba(18,24,34,.3); --glass-brd:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.12);
  --solid:#151b24; --ink:#eef3f8; --muted:#b6c2ce; --line:rgba(255,255,255,.13); --chip:rgba(255,255,255,.08); --chip-on:rgba(255,255,255,.22);
  --accent:#7aa7f5; --accent-soft:rgba(122,167,245,.2); --on-map:#f2f6fa; --shadow:rgba(0,0,0,.45); --toast-bg:rgba(240,245,250,.86); --toast-fg:#0d1620;
  --zr:#4cc06a; --zc:#57a3ea; --zi:#e8ad34; --warn:#ef6f5b; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:12.5px;overflow:hidden;-webkit-font-smoothing:antialiased}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#view.pan{cursor:grab}
.panel{position:fixed;background:linear-gradient(145deg,var(--glass),var(--glass2));-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);
  border:1px solid var(--glass-brd);border-radius:18px;box-shadow:0 12px 34px var(--shadow),inset 0 1px 0 var(--glass-hi);color:var(--ink)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.panel{background:var(--solid)}}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.02em}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,calc(env(safe-area-inset-left,0px) + 10px));right:max(12px,calc(env(safe-area-inset-right,0px) + 10px));display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;z-index:12;pointer-events:none;color:var(--ink)}
.hgrp{display:flex;align-items:center;gap:8px;flex:none;pointer-events:auto;padding:6px 10px;min-height:44px;box-sizing:border-box;background:linear-gradient(145deg,var(--glass),var(--glass2));-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border:1px solid var(--glass-brd);border-radius:16px;box-shadow:0 12px 34px var(--shadow),inset 0 1px 0 var(--glass-hi);color:var(--ink)}
.hcity{padding-left:14px}
.hfill{flex:1;min-width:0}
.hmore{display:none}
#tools.collapsed .tgRow{display:none}
.ddBtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--glass-brd);background:var(--chip);border-radius:10px;padding:5px 9px 5px 11px;min-height:28px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.ddBtn:hover,.ddBtn[aria-expanded="true"]{background:var(--chip-on)}
.ddBtn svg{width:12px;height:12px;transition:transform .15s}
.ddBtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.ddList{z-index:30;padding:5px;display:flex;flex-direction:column;gap:2px;min-width:112px;border-radius:14px}
.ddList button{border:0;background:transparent;text-align:left;padding:6px 10px;border-radius:9px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.ddList button:hover{background:var(--chip)}
.ddList button[aria-selected="true"]{background:var(--chip-on);color:var(--accent);font-weight:600;box-shadow:0 1px 3px var(--shadow)}
.hstats{gap:14px}
.sel,.amt{display:inline-flex;align-items:center;gap:6px}
#wxAmt{width:84px;accent-color:var(--accent)}
.city{font-family:var(--f-display);font-size:22px;line-height:1.1;border:0;background:transparent;color:var(--ink);width:6em;padding:0;border-bottom:1px dashed transparent}
.city:hover,.city:focus{border-bottom-color:var(--line);outline:none}
.date{font-size:12.5px;color:var(--muted)}
.wx{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 9px 3px 6px;border-radius:999px;background:var(--chip);border:1px solid var(--glass-brd)}
.wx svg{width:15px;height:15px}
.stat{display:flex;align-items:baseline;gap:6px;min-width:0}
.lbl{font-size:11px;color:var(--muted);letter-spacing:.04em}
.stat .num{font-size:15px}
.seg{display:inline-flex;background:var(--chip);border:1px solid var(--glass-brd);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:4px 9px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:4px;min-height:26px}
.seg button[aria-pressed="true"]{background:var(--chip-on);box-shadow:0 1px 3px var(--shadow);color:var(--accent);font-weight:600}
.seg svg{width:12px;height:12px;fill:currentColor}
.btn{border:1px solid var(--glass-brd);background:var(--chip);border-radius:10px;padding:5px 11px;cursor:pointer;font-size:12.5px;min-height:28px;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--chip-on)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn svg{width:13px;height:13px;fill:currentColor}
.btn.warn{color:var(--warn)}
#tools{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:max(12px,calc(env(safe-area-inset-left,0px) + 10px));right:calc(max(12px,env(safe-area-inset-right,0px) + 10px) + 270px);margin:0 auto;width:max-content;max-width:calc(100% - 300px);padding:6px 8px 6px;display:flex;flex-direction:column;gap:5px;z-index:11}
.tgTabs{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.tgTab{border:0;background:transparent;border-radius:8px;padding:3px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;min-height:24px}
.tgTab[aria-pressed="true"]{background:var(--chip-on);color:var(--accent);font-weight:600;box-shadow:0 1px 3px var(--shadow)}
.tgRow{display:flex;gap:2px;justify-content:center;overflow-x:auto;scrollbar-width:thin;padding-bottom:1px}
.laneSel{align-self:center;margin-left:8px;flex:none}
.laneSel button{min-width:26px;justify-content:center;padding:4px 6px}
.laneLbl{align-self:center;font-size:11px;color:var(--muted);margin-left:10px;flex:none}
.tg{font-size:11px;color:var(--muted);letter-spacing:.06em;padding:8px 8px 2px}
.tg:first-child{padding-top:2px}
.tool{display:flex;flex-direction:column;align-items:center;gap:0;padding:2px 6px 3px;border-radius:10px;min-width:62px;background:transparent;border:1px solid transparent;cursor:pointer;font-size:11px;flex:none;white-space:nowrap}
.tool:hover{background:var(--chip)}
.tool[aria-pressed="true"]{background:var(--chip-on);border-color:var(--accent);box-shadow:0 2px 8px var(--shadow)}
.tool img{width:32px;height:36px;flex:none}
#side{top:calc(env(safe-area-inset-top,0px) + var(--hudh,56px) + 18px);right:max(12px,calc(env(safe-area-inset-right,0px) + 10px));width:272px;padding:2px 15px 15px;max-height:calc(100% - var(--hudh,56px) - 200px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;scrollbar-width:thin}
#side h2{font-family:var(--f-display);font-weight:400;font-size:15px;margin:14px 0 8px;display:flex;align-items:center;gap:8px;text-wrap:balance}
.tag{font-family:var(--f-body);font-size:11px;color:var(--zr);border:1px solid currentColor;border-radius:999px;padding:1px 7px;letter-spacing:.04em}
.rci{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rci .col{display:flex;flex-direction:column;align-items:center;gap:4px}
.track{position:relative;width:22px;height:66px;background:var(--chip);border:1px solid var(--glass-brd);border-radius:6px;overflow:hidden}
.track::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.fill{position:absolute;left:0;right:0;border-radius:2px}
.rci .lbl b{font-weight:600}
dl.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;margin:0}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.tax,.vol{display:grid;grid-template-columns:44px 1fr 38px;align-items:center;gap:8px;margin:4px 0}
.tax input,.vol input{width:100%;accent-color:var(--accent)}
.tax output,.vol output{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:11px;color:var(--muted);line-height:1.5;margin:6px 0 0}
#spark{width:100%;height:60px;display:block}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{border:1px solid var(--glass-brd);background:var(--chip);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12.5px;min-height:26px}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.legend{margin-top:8px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.legend i{display:block;flex:1;height:8px;border-radius:4px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.mood{font-size:12.5px;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
#miniWrap{right:max(12px,calc(env(safe-area-inset-right,0px) + 10px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:7px}
#mini{width:240px;height:120px;display:block;cursor:pointer;border-radius:10px}
#info{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 118px);padding:11px 15px;min-width:240px;max-width:calc(100% - 32px)}
#info h3{font-family:var(--f-display);font-weight:400;font-size:15px;margin:0 0 6px;display:flex;justify-content:space-between;gap:12px}
#info h3 button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:15px;line-height:1}
#hint{position:fixed;left:max(12px,calc(env(safe-area-inset-left,0px) + 10px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);color:var(--on-map);font-size:12.5px;text-shadow:0 1px 3px rgba(0,0,0,.75);pointer-events:none;max-width:60%}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-fg);padding:7px 15px;border-radius:999px;font-size:12.5px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:1px}
#side.closed{display:none}
#menu{top:calc(env(safe-area-inset-top,0px) + var(--hudh,56px) + 18px);right:max(12px,calc(env(safe-area-inset-right,0px) + 10px));width:290px;padding:2px 16px 16px;z-index:20;max-height:calc(100% - 100px);overflow-y:auto}
#menu h2,#side h2{font-family:var(--f-display);font-weight:400;font-size:15px;margin:14px 0 8px}
.pill:disabled{opacity:.45;cursor:not-allowed}
dl.keys dd{font-weight:400;color:var(--ink)}
#codeBox{width:100%;margin-top:8px;font:11px/1.4 var(--f-num);background:var(--chip);color:var(--ink);border:1px solid var(--glass-brd);border-radius:10px;padding:6px 8px;resize:vertical;box-sizing:border-box}
.seg button:disabled{opacity:.35;cursor:default}
body.photo .panel,body.photo #hud{display:none!important}
#photoExit{position:fixed;right:max(12px,calc(env(safe-area-inset-right,0px) + 10px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:40;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#palette{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 118px);width:min(820px,calc(100% - 340px));padding:10px 12px 8px;z-index:15;display:flex;flex-direction:column;gap:8px}
.palHead{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
#palGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;max-height:min(300px,38vh);overflow-y:auto;scrollbar-width:thin;padding:2px}
.palItem{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border-radius:10px;border:1px solid transparent;background:var(--chip);cursor:pointer;font-size:11px;min-width:0}
.palItem img{width:60px;height:70px;object-fit:contain}
.palItem span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.palItem:hover{background:var(--chip-on)}
.palItem[aria-pressed="true"]{border-color:var(--accent);background:var(--chip-on);box-shadow:0 2px 8px var(--shadow)}
.palX{width:60px;height:70px;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--muted)}
#palette .note{margin:0}
[hidden]{display:none!important}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--on-map);font-family:var(--f-display);font-size:22px;z-index:50}
#hud .ddi{width:13px;height:13px;opacity:.7;margin-right:4px;flex:none}
@media (max-width:1480px){.hwx .lbl{display:none}.hwx #wxAmt{width:64px}.hwx{gap:6px}}
@media (max-width:900px){
  .hwx .lbl,.hstats .lbl{display:none}
  #wxAmt{width:60px}
}
@media (max-width:720px){
  #hud{gap:6px;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(8px,calc(env(safe-area-inset-left,0px) + 6px));right:max(8px,calc(env(safe-area-inset-right,0px) + 6px))}
  .hgrp{padding:3px 8px;min-height:38px;border-radius:14px}
  .hcity{flex:1;min-width:0;padding-left:12px;gap:7px}
  .hmore{display:flex;padding:3px}
  .hmore .btn{min-height:30px;min-width:34px;justify-content:center;padding:4px 8px;border-radius:10px}
  .hmore .btn svg{width:14px;height:14px}
  #hud:not(.open) .mx{display:none}
  #hud.open .mx{justify-content:center}
  #hud.open .hspd{flex:1 1 100%}
  #hud.open .hwx{flex:1 1 0;min-width:0}
  #hud.open .hundo{flex:0 0 auto}
  #hud.open .hend{flex:1 1 100%}
  .hcity{flex:1 1 0}
  .hmore{flex:0 0 auto}
  .hfill{display:none}
  .city{font-size:15px;width:auto;min-width:0;flex:1 1 auto;max-width:7.5em}
  .date{font-size:12.5px}
  .wx{font-size:11px;padding:2px 7px 2px 5px}
  .hstats{display:none}
  #tools{left:max(8px,calc(env(safe-area-inset-left,0px) + 6px));right:max(8px,calc(env(safe-area-inset-right,0px) + 6px));bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:auto;max-width:none;padding:4px 5px;gap:3px;border-radius:16px}
  .tgTabs{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
  .tgTabs::-webkit-scrollbar{display:none}
  .tgTab{flex:none;padding:4px 10px;min-height:28px}
  .tgRow{justify-content:flex-start;scrollbar-width:none}
  .tgRow::-webkit-scrollbar{display:none}
  .tool{min-width:50px;font-size:11px;padding:2px 4px 3px}
  .tool img{width:26px;height:29px}
  #palette{left:8px;right:8px;transform:none;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + var(--tbh,96px) + 14px);z-index:25;padding:8px 10px 6px}
  #palGrid{max-height:28vh;grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
  .palItem img{width:50px;height:58px}
  #menu,#side{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + var(--tbh,96px) + 14px);left:max(8px,calc(env(safe-area-inset-left,0px) + 6px));right:max(8px,calc(env(safe-area-inset-right,0px) + 6px));width:auto;max-height:min(56%,calc(100% - var(--tbh,96px) - 90px))}
  #miniWrap{display:none}
  #info{bottom:calc(env(safe-area-inset-bottom,0px) + var(--tbh,96px) + 14px);min-width:0;width:calc(100% - 28px);box-sizing:border-box}
  #hint{display:none}
}
@media (max-width:720px) and (max-height:520px){
  .tool span{display:none}
  .tool{min-width:40px}
  #menu,#side{max-height:calc(100% - var(--tbh,96px) - 70px)}
}

/* ===== type: one sans family, four sizes (11 / 12.5 / 15 / 22), Manrope figures ===== */
:root{--f-display:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--f-num:"Manrope","Noto Sans KR",system-ui,sans-serif}
body{font-size:12.5px;letter-spacing:-.005em}
.num,.city,.date,#fNet,#sPop,.kp2 b,.mtr .num,.tax output,.vol output,dl.kv dd{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:0}
.city{font-weight:600;font-size:17px!important;letter-spacing:-.01em;font-family:var(--f-body)}
.lbl,.sh,#menu h2,.note,.tg,.kp2 .lbl,.keys{font-size:11px!important}
.sh,#menu h2{font-weight:600;letter-spacing:.06em;color:var(--muted)}
.btn,.seg button,.pill,.sw,.tile,.ddBtn,.ddList button,#ctx button,.tgTab,.tool{font-size:12.5px!important;font-weight:500}
.tile,.ovb,.tool{font-size:11px!important}
.stat .num,.kp2 b,.mtr .num,.tax output,.vol output{font-size:15px!important;font-weight:600}
.mtr .num,.tax output,.vol output{font-size:12.5px!important}
.kpi b,.net b{font-size:22px!important;font-weight:700}
#info h3{font-family:var(--f-body);font-weight:600;font-size:15px}
#menu{width:254px;box-sizing:border-box;padding:12px}
/* ===== matte dark: low-transparency glass, one border per surface, no nested outlines ===== */
:root,:root[data-theme],:root:not([data-theme="light"]){
  --bg:#0d1015; --glass:rgba(19,22,28,.86); --glass2:rgba(19,22,28,.86); --glass-brd:rgba(255,255,255,.07); --glass-hi:transparent;
  --solid:#14171d; --ink:#e7ebf0; --muted:#8a94a1; --line:rgba(255,255,255,.07); --chip:rgba(255,255,255,.055); --chip-on:rgba(255,255,255,.13);
  --accent:#6fa2ff; --accent-soft:rgba(111,162,255,.17); --shadow:rgba(0,0,0,.42); --toast-bg:rgba(19,22,28,.94); --toast-fg:#e7ebf0;
  --zr:#4cc06a; --zc:#57a3ea; --zi:#e8ad34; --warn:#ef6f5b; color-scheme:dark}
.panel,.hgrp{background:var(--glass)!important;-webkit-backdrop-filter:blur(10px)!important;backdrop-filter:blur(10px)!important;border:1px solid var(--glass-brd)!important;box-shadow:0 8px 22px var(--shadow)!important}
.panel{border-radius:14px}.hgrp{border-radius:13px}
body.pix #view{image-rendering:pixelated;image-rendering:crisp-edges}
@media (min-width:721px){.hend{width:254px;margin-left:auto;gap:6px;padding:6px 8px}.hend .btn{flex:1 1 0;justify-content:center;padding:5px 6px}}
.seg,.btn,.ddBtn,.wx,.pill,.track,#codeBox,.palItem,.tool{border-color:transparent!important}
.seg{background:rgba(255,255,255,.04)}
.seg button[aria-pressed="true"],.tgTab[aria-pressed="true"],.ddList button[aria-selected="true"]{box-shadow:none;background:var(--chip-on)}
.tool[aria-pressed="true"]{background:var(--accent-soft);box-shadow:none}
.palItem[aria-pressed="true"]{background:var(--accent-soft);box-shadow:none;outline:1.5px solid var(--accent);outline-offset:-1.5px}
#miniWrap{padding:6px}#mini{border-radius:9px}
svg{flex:none}
/* status card: same width as the minimap, numbers first */
#side{width:254px;box-sizing:border-box;padding:12px 12px 10px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:none}
#side::-webkit-scrollbar{display:none}
.kpi .kh{display:flex;align-items:baseline;justify-content:space-between}
.kpi b{font-size:22px;font-weight:600;letter-spacing:-.01em}
#spark{width:100%;height:42px;display:block;margin-top:2px}
.kp2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kp2>div{background:var(--chip);border-radius:10px;padding:7px 9px;display:flex;flex-direction:column;gap:2px}
.kp2 b{font-size:15px;font-weight:600}
.kp2 .lbl{font-size:11px;display:flex;align-items:center}
.blk{display:flex;flex-direction:column;gap:6px}
.sh{font-size:11px;color:var(--muted);letter-spacing:.08em;font-weight:600}
.dem{display:grid;grid-template-columns:12px 1fr;align-items:center;gap:8px;font-size:11px}
.dtrack{position:relative;height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.dtrack::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(255,255,255,.22)}
.dtrack .fill{position:absolute;top:0;bottom:0;border-radius:4px}
.mtr{display:grid;grid-template-columns:16px 1fr 40px;align-items:center;gap:8px}
.mtr svg{width:14px;height:14px}
.mt{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}.mt i{display:block;height:100%;width:0;background:#f2c94c;border-radius:3px;transition:width .4s}
.mtr .num{text-align:right;font-size:12.5px}
.net{display:flex;align-items:baseline;gap:8px}.net b{font-size:22px;font-weight:600}
.fin{display:flex;gap:12px;font-size:11px;align-items:center;flex-wrap:wrap}.fin>span{display:inline-flex;align-items:center}
.tax{grid-template-columns:14px 1fr 34px;gap:8px;margin:0}.tax label{font-weight:700;font-size:11px}
.ovg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.ovb{display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px!important;padding:7px 2px!important;font-size:11px!important;min-height:0!important}
.ovb svg{width:16px;height:16px}
.ovb[aria-pressed="true"]{background:var(--accent-soft)!important;color:var(--accent)!important}
.legend{margin-top:2px}
/* settings: tiles, switches, icon segments */
#menu{width:254px;box-sizing:border-box;padding:12px}
#menu h2{font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:.08em;font-weight:600;margin:14px 0 6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.tiles.two{grid-template-columns:1fr 1fr;margin-top:6px}.tiles.three{grid-template-columns:repeat(3,1fr)}
.tile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px 8px;border:0;border-radius:11px;background:var(--chip);cursor:pointer;font-size:11px;color:var(--ink)}
.tile:hover{background:var(--chip-on)}.tile svg{width:18px;height:18px}.tile.warn{color:var(--warn)}
.tiles.two .tile{flex-direction:row;justify-content:center;padding:8px}
.sws{display:flex;flex-direction:column;gap:1px}
.sw{display:flex!important;align-items:center;gap:10px;width:100%;border:0!important;border-radius:9px!important;background:transparent!important;padding:7px 6px!important;cursor:pointer;font-size:12.5px!important;color:var(--ink)!important;text-align:left}
.sw:hover{background:var(--chip)!important}.sw svg{width:15px;height:15px;color:var(--muted)}
.sw span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.knob{width:30px;height:17px;border-radius:9px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .15s}
.knob::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#cfd6df;transition:transform .15s}
.sw[aria-pressed="true"] .knob{background:var(--accent)}.sw[aria-pressed="true"] .knob::after{transform:translateX(13px);background:#fff}
.sw[aria-pressed="true"] svg{color:var(--accent)}
.seg.wide{display:grid;grid-template-columns:repeat(5,1fr);width:100%;box-sizing:border-box}
.seg.wide .pill{display:flex;justify-content:center;align-items:center;border-radius:8px!important;padding:6px 0!important;background:transparent}
.seg.wide .pill svg{width:16px;height:16px}
.seg.wide .pill[aria-pressed="true"]{background:var(--chip-on)!important;color:var(--ink)!important}
.vol{grid-template-columns:18px 1fr 30px;margin:5px 0}.vol label svg{width:15px;height:15px;color:var(--muted)}
details.move{margin-top:4px}details.move summary{list-style:none;cursor:pointer;display:flex;align-items:center}
details.move summary::-webkit-details-marker{display:none}details.move summary h2::after{content:" ▾";opacity:.6}
#codeBox{margin-top:6px}
.keys{display:flex;gap:10px;justify-content:space-between;margin-top:14px;font-size:11px;color:var(--muted)}
.keys span{display:inline-flex;align-items:center;gap:5px}
kbd{font:600 10px var(--f-body);background:var(--chip-on);border-radius:5px;padding:2px 5px;color:var(--ink)}
/* right-click quick menu */
#ctx{z-index:40;padding:5px;min-width:168px;display:flex;flex-direction:column;gap:1px}
#ctx .ch{font-size:11px;color:var(--muted);padding:5px 9px 4px;white-space:nowrap}
#ctx button{display:flex;align-items:center;gap:9px;border:0;background:transparent;border-radius:8px;padding:7px 9px;font-size:12.5px;cursor:pointer;color:var(--ink);text-align:left}
#ctx button:hover{background:var(--chip-on)}#ctx button svg{width:14px;height:14px;color:var(--muted)}#ctx button.warn{color:var(--warn)}#ctx button.warn svg{color:var(--warn)}
#ctx hr{border:0;height:1px;background:var(--line);margin:3px 4px}
@media (max-width:720px){#side,#menu{width:auto}}
.tile span,.sw span,.btn,.pill,.lbl,.sh,.kp2 .lbl,#ctx button,.ch,.tool,.palItem span,.tgTab,.keys span,.net .lbl,.fin>span{white-space:nowrap}
.tile.arm{background:var(--accent-soft);color:var(--accent)}.tile.warn.arm{background:rgba(239,111,91,.16);color:var(--warn)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
