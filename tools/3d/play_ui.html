<title>ISLE 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: full-bleed canvas, one matte dark-glass toolbar docked at the bottom, picker sheet above it */
:root{color-scheme:dark;--sky1:#7fd0ff;--sky2:#3fa2f5;--sky3:#1f6fe0;--glass:rgba(22,28,38,.82);--fg:#eef3f8;--mut:#9fb0c2;--acc:#4fb6f0;--on:rgba(79,182,240,.24);--font:"Pretendard","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:linear-gradient(var(--sky1),var(--sky2) 55%,var(--sky3));color:var(--fg);font-family:var(--font);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;filter:saturate(1.3) contrast(1.06);outline:none}
#haze{position:fixed;inset:0;pointer-events:none;mix-blend-mode:screen}
#stars{position:fixed;inset:0;pointer-events:none;opacity:0}
#stars i{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 4px 1px rgba(220,230,255,.7);animation:tw var(--d) ease-in-out var(--l) infinite alternate}
@keyframes tw{from{opacity:var(--a)}to{opacity:.08}}
@media (prefers-reduced-motion:reduce){#stars i{animation:none}}
#sun,#moon{position:fixed;left:-200px;top:0;border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}
#sun{width:68px;height:68px;box-shadow:0 0 40px 14px rgba(255,236,190,.55),0 0 110px 40px rgba(255,226,170,.25)}
#moon{width:44px;height:44px;box-shadow:inset -11px 5px 0 0 #f4f0dc;filter:drop-shadow(0 0 12px rgba(225,233,255,.55))}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:16px}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 2*max(16px,env(safe-area-inset-left,0px)));display:flex;gap:4px;padding:6px;overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar,.row::-webkit-scrollbar{display:none}
button{font:600 14px var(--font);color:var(--fg);background:transparent;border:0;border-radius:11px;padding:10px 13px;white-space:nowrap;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
button[aria-pressed="true"]{background:var(--on);color:#fff}
button:disabled{color:var(--mut);cursor:default}
#pick{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));width:min(680px,calc(100% - 2*max(16px,env(safe-area-inset-left,0px))));padding:6px;display:flex;flex-direction:column;gap:2px}
.row{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.row button{font-weight:500;padding:8px 11px}
#top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:2px;padding:6px}
#top button{padding:9px;min-width:40px;display:grid;place-items:center;color:#dfe7ef}
#top svg,#menu svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#top .tl{display:none}
#top button[aria-pressed="true"]{color:#fff}#top button:disabled{color:rgba(159,176,194,.45)}
#menu button{display:flex;align-items:center;gap:10px}
#env{position:fixed;top:calc(72px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));padding:8px;display:flex;flex-direction:column;gap:4px;width:min(320px,calc(100% - 32px))}
#env .er{display:flex;align-items:center;gap:6px}
#tlab{font:600 14px var(--font);min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
#tval{flex:1;accent-color:var(--acc);min-width:0}
#env .er button{flex:1}
#isl{position:fixed;top:calc(72px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));padding:8px;display:flex;flex-direction:column;gap:4px;width:min(380px,calc(100% - 32px));max-height:calc(100% - 180px);overflow:auto}
#isl .slot{display:flex;align-items:center;gap:10px;padding:6px;border-radius:12px}
#isl .slot.cur{background:rgba(255,255,255,.06)}
#isl .th{width:64px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:rgba(255,255,255,.06)}
#isl .st{flex:1;display:flex;flex-direction:column;min-width:0}
#isl .st b{font:600 14px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#isl .st span{font:500 12px var(--font);color:var(--mut)}
#isl .newi{display:flex;flex-direction:column;gap:6px;padding:6px 2px 2px}
#isl .er{display:flex;gap:4px}#isl .er button{flex:1}#isl .go{background:var(--on)}
#isl .card .ic{image-rendering:pixelated;background:transparent}
#shot{position:fixed;inset:0;background:rgba(8,12,20,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;z-index:20}
#shotc{max-width:100%;max-height:calc(100% - 80px);border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
#shot .sbar{display:flex;gap:4px;padding:6px}
.card{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none;width:78px;padding:6px 4px 5px}
.card .ic{width:60px;height:60px;border-radius:10px;display:grid;place-items:center;font:600 22px var(--font);color:var(--mut);object-fit:contain}
.card span:not(.ic){font:500 11px var(--font);color:var(--mut);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card[aria-pressed="true"] span:not(.ic){color:#fff}
.card img.ic{filter:saturate(1.3) contrast(1.06)}
.card img.ic[src=""],.card img.ic:not([src]){background:rgba(255,255,255,.06)}
.row .dir{padding:8px 10px;min-width:38px}
.row .sep{flex:none;width:1px;margin:6px 4px;background:rgba(255,255,255,.14)}
#msg{position:fixed;top:calc(72px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);white-space:nowrap;padding:10px 14px;font:600 14px var(--font);pointer-events:none;transition:opacity .2s}
#msg:empty{opacity:0}
#menu{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));padding:6px;display:flex;flex-direction:column;gap:2px;min-width:140px}
#menu button{text-align:left}
/* phones: every bar spans the width, tools share it evenly, rare actions move into the ⋯ menu */
@media (max-width:600px){
 #top{right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));padding:4px}
 #top button{padding:9px;min-width:40px}
 #bar{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));transform:none;max-width:none;padding:4px;gap:2px;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
 #bar button{flex:1 1 0;min-width:0;padding:12px 0;font-size:13px}
 #pick{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));transform:none;width:auto;bottom:calc(66px + env(safe-area-inset-bottom,0px));padding:4px}
 #cats{flex-wrap:wrap;row-gap:2px}
 #cats .sep{flex-basis:100%;width:auto;height:0;margin:0}
 .row .dir{min-width:40px;padding:8px 8px}
 .card{width:66px}.card .ic{width:50px;height:50px}
 #env,#isl{top:calc(62px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto}
 #isl{max-height:calc(100% - 200px)}
 #msg{top:calc(62px + env(safe-area-inset-top,0px));max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;font-size:13px}
}
@media (prefers-reduced-motion:reduce){#msg{transition:none}}
</style>
<div id="stars" aria-hidden="true"></div><div id="sun" aria-hidden="true"></div><div id="moon" aria-hidden="true"></div><canvas id="cv" tabindex="0" aria-label="도시"></canvas><div id="haze" aria-hidden="true"></div>
<div id="msg" class="glass" role="status">불러오는 중</div>
<div id="top" class="glass"><button id="undo" disabled aria-label="되돌리기" title="되돌리기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span class="tl">되돌리기</span></button><button id="redo" disabled aria-label="다시하기" title="다시하기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg><span class="tl">다시하기</span></button><button id="islb" aria-pressed="false" aria-label="섬" title="섬"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5z"/><path d="m3 13 9 5 9-5"/></svg><span class="tl">섬</span></button><button id="envb" aria-pressed="false" aria-label="시간·날씨·움직임" title="시간·날씨·움직임"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 1 0 0-8z"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.9 4.9 1.4 1.4"/><path d="m17.7 17.7 1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.3 17.7-1.4 1.4"/><path d="m19.1 4.9-1.4 1.4"/></svg><span class="tl">시간·날씨</span></button><button id="more" aria-expanded="false" aria-label="더 보기" title="더 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01"/><path d="M12 12h.01"/><path d="M19 12h.01"/></svg><span class="tl">더 보기</span></button></div><div id="menu" class="glass" hidden><button id="photo" aria-label="사진" title="사진"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><path d="M12 10a3 3 0 1 0 0 6 3 3 0 1 0 0-6z"/></svg><span class="tl">사진</span></button><button id="reset" aria-label="처음으로" title="처음으로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span class="tl">처음으로</span></button></div>
<div id="isl" class="glass" hidden></div>
<div id="env" class="glass" hidden><div class="er"><span id="tlab">13:00</span><input id="tval" type="range" min="0" max="24" step=".25" aria-label="시간"><button id="tauto" aria-pressed="false">흐르기</button></div><div class="er"><button data-wx="clear">맑음</button><button data-wx="rain">비</button><button data-wx="snow">눈</button></div><div class="er"><button id="mo" aria-pressed="true">움직임</button></div></div>
<div id="shot" hidden><canvas id="shotc"></canvas><div class="glass sbar"><button id="stilt" aria-pressed="true">미니어처</button><button id="ssave">저장</button><button id="sclose">닫기</button></div></div>
<div id="pick" class="glass" hidden><div class="row" id="cats"></div><div class="row" id="items"></div></div>
<div id="bar" class="glass" role="toolbar" aria-label="도구"></div>
