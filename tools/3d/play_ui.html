<title>ISLE 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 유리판: PC = 위젯의 어두운 리퀴드 글래스(70%·흐림 20·위 한 줄 반사광), 폰 = 앱 폰 화면의 밝은 리퀴드 글래스(76%) + 떠 있는 하단 탭(둥근 메뉴 단추 + 캡슐 + 미끄러지는 알약).
   둥근 판(18~30) 안의 단추는 각진 3px — 앱과 같은 결 */
:root{color-scheme:dark;--sky1:#7fd0ff;--sky2:#3fa2f5;--sky3:#1f6fe0;--font:"Pretendard","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
 --b600:#3E71D2;--b400:#538CDE;--btint:rgba(62,113,210,.12);
 --fill:rgba(26,29,38,.7);--blur:blur(20px) saturate(1.3);--edge:0 0 0 1px rgba(0,0,0,.25);--hi:inset 0 1px 0 rgba(255,255,255,.12);--drop:0 18px 50px rgba(0,0,0,.45);--line:transparent;
 --fg:#fff;--fg2:rgba(255,255,255,.8);--mut:rgba(255,255,255,.62);--hov:rgba(255,255,255,.12);--sub:rgba(255,255,255,.08);--on:var(--b600);--onfg:#fff;--sep:rgba(255,255,255,.16);
 --ind:rgba(255,255,255,.14);--indsh:inset 0 1px 0 rgba(255,255,255,.14);--r:18px;--acc:#9DBDEA}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:linear-gradient(var(--sky1),var(--sky2) 55%,var(--sky3));color:var(--fg);font-family:var(--font);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;filter:saturate(1.3) contrast(1.06);outline:none}
#haze{position:fixed;inset:0;pointer-events:none;mix-blend-mode:screen}
#stars{position:fixed;inset:0;pointer-events:none;opacity:0}
#stars i{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 4px 1px rgba(220,230,255,.7);animation:tw var(--d) ease-in-out var(--l) infinite alternate}
@keyframes tw{from{opacity:var(--a)}to{opacity:.08}}
@media (prefers-reduced-motion:reduce){#stars i{animation:none}}
/* 해·달 — 카툰 클레이: 무광 공에 부드러운 명암, 둥근 꽃잎 햇살, 움푹한 분화구 */
#sun,#moon{position:fixed;left:-300px;top:0;border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}
#sun{width:150px;height:150px;background:radial-gradient(circle closest-side,rgba(255,236,190,calc(.36*var(--gl,1))) 20%,rgba(255,228,170,calc(.14*var(--gl,1))) 46%,rgba(255,222,165,0) 100%)}
#moon::after{display:none}
#sun::before{display:none;content:"";position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle at 40% 36%,#4a5372,#2a3048);box-shadow:0 0 6px 2px rgba(255,236,190,.55);transform:translateX(var(--ex,0));z-index:2}
#sun.ecl::before{display:block}
#sun::after,#moon::before{content:"";position:absolute;left:50%;top:50%;background:var(--img) center/contain no-repeat}
#sun::after{width:84px;height:84px;margin:-42px 0 0 -42px;z-index:1;filter:saturate(.85) drop-shadow(0 0 7px rgba(255,232,170,.6));opacity:.8}
#sun .ry{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;background:center/contain no-repeat;opacity:calc(.78*var(--ra,1));filter:saturate(.85) drop-shadow(0 0 5px rgba(255,232,170,.5))}
#moon::before{width:110px;height:110px;margin:-55px 0 0 -55px;filter:drop-shadow(0 0 8px rgba(226,234,255,.5));opacity:.8}
/* 판 */
.glass{background:var(--fill);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--edge),var(--hi),var(--drop)}
button{font:600 14px var(--font);color:var(--fg2);background:transparent;border:0;border-radius:3px;padding:10px 13px;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .12s cubic-bezier(.4,0,.2,1),color .12s}
@media (hover:hover) and (pointer:fine){button:hover:not(:disabled):not([aria-pressed="true"]){background:var(--hov)}}
button:active:not(:disabled){background:var(--hov)}
button:focus-visible{outline:2px solid var(--b400);outline-offset:-2px}
button[aria-pressed="true"]{background:var(--on);color:var(--onfg)}
button:disabled{color:var(--mut);opacity:.5;cursor:default}
/* 하단 도구 — 켜진 칸 뒤로 알약이 미끄러진다 */
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 2*max(16px,env(safe-area-inset-left,0px)));padding:6px;overflow-x:auto;scrollbar-width:none}
#barc{display:flex;gap:4px}
#bari{position:absolute;top:0;left:0;width:0;height:0;border-radius:12px;background:var(--ind);box-shadow:var(--indsh);opacity:0;pointer-events:none;transition:transform .42s cubic-bezier(.34,1.36,.64,1),width .42s cubic-bezier(.34,1.36,.64,1),opacity .12s}
#bari.on{opacity:1}
#bar::-webkit-scrollbar,.row::-webkit-scrollbar{display:none}
#bar .tcard{width:70px;padding:5px 4px 4px;gap:2px;border-radius:12px;position:relative;z-index:1}
#bar .tcard[aria-pressed="true"]{background:transparent;box-shadow:none}
#bar .tcard .ic{width:44px;height:44px}#bar .tcard span:not(.ic){font-size:12px;font-weight:600}
#bar .tcard[aria-pressed="true"] span:not(.ic){color:var(--fg)}
#pick{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));width:min(680px,calc(100% - 2*max(16px,env(safe-area-inset-left,0px))));padding:6px;display:flex;flex-direction:column;gap:2px;max-height:calc(100% - 150px);overflow-y:auto}
.row{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.row button{font-weight:500;padding:8px 11px}
#cats button[aria-pressed="true"]{font-weight:600}
/* 머리 단추 — 위젯 머리처럼 기능별 묶음(각진 3px) */
#top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px}
#top .tg{display:flex;gap:2px;padding:2px;border-radius:3px;background:rgba(16,20,30,.5);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#top button{padding:8px;min-width:38px;display:grid;place-items:center;color:var(--fg2)}
#top svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#top .tl{display:none}
#top button[aria-pressed="true"]{background:var(--on);color:#fff}
#env{position:fixed;top:calc(68px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));padding:8px;display:flex;flex-direction:column;gap:4px;width:min(300px,calc(100% - 32px));max-height:calc(100% - 96px);overflow-y:auto}
#env .er{display:flex;align-items:center;gap:4px}
#tlab{font:600 14px var(--font);min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
#tval{flex:1;accent-color:var(--b600);min-width:0}
#env .er button{flex:1}#env .icb{padding:8px 0}#env .icb svg{width:20px;height:20px}#env .ics .sep{flex:none;width:1px;align-self:stretch;margin:6px 2px;background:var(--sep)}#env #tauto{flex:none;width:40px}
#isl{position:fixed;top:calc(68px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));padding:8px;display:flex;flex-direction:column;gap:4px;width:min(316px,calc(100% - 32px));max-height:calc(100% - 180px);overflow:auto}
#ctx{position:fixed;z-index:40;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:2px;min-width:112px;max-height:calc(100% - 16px);overflow-y:auto;--r:14px}
#ctx .hd{grid-column:1/-1;font:600 12px var(--font);color:var(--mut);padding:4px 8px 6px;white-space:nowrap;text-align:center}#ctx .wide{grid-column:1/-1}
.icb{display:grid;place-items:center;padding:10px 16px}.icb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}#ctx .icb{padding:10px}
#isl .slot{display:flex;align-items:center;gap:10px;padding:6px;border-radius:3px}
#isl .slot.cur{background:var(--sub)}
#isl .th{width:64px;height:40px;border-radius:3px;object-fit:cover;flex:none;background:var(--sub)}
#isl .st{flex:1;display:flex;flex-direction:column;min-width:0}
#isl .st b{font:600 14px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
#isl .st span{font:500 12px var(--font);color:var(--mut)}
#isl .newi{display:flex;flex-direction:column;gap:6px;padding:6px 2px 2px}
#isl .er{display:flex;gap:4px;flex-wrap:wrap}#isl .er button{flex:1}#isl .go{background:var(--on);color:var(--onfg)}#isl .newi{min-width:0}#isl .chips button{flex:none;padding:7px 10px;font-size:13px}#isl .szr{align-items:center;flex-wrap:nowrap}#isl .szr input{flex:1;accent-color:var(--b600);min-width:0}#isl .lb{font:600 13px var(--font);color:var(--fg2);min-width:64px}#isl .plus{padding:8px}#isl .plus svg{width:18px;height:18px}
#cfm{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(8,12,20,.32)}#cfm .cbox{padding:16px;width:min(300px,calc(100% - 40px));display:flex;flex-direction:column;gap:12px}#cfm p{margin:0;font:600 15px/1.45 var(--font);color:var(--fg);text-align:center}#cfm .er{display:flex;gap:6px}#cfm .er button{flex:1}#cfm .go{background:var(--on);color:var(--onfg)}
#isl .card .ic{image-rendering:pixelated;background:transparent}
#shot{position:fixed;inset:0;background:rgba(8,12,20,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;z-index:20}
#shotc{max-width:100%;max-height:calc(100% - 80px);border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
#shot .sbar{display:flex;gap:4px;padding:6px}
.card{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none;width:78px;padding:6px 4px 5px;position:relative}
.card[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--fg)}
.card .sz{position:absolute;top:4px;right:5px;font:600 9px/1.4 var(--font);font-style:normal;color:#fff;background:rgba(20,24,30,.55);padding:0 4px;border-radius:3px;pointer-events:none}
.card .ic{width:60px;height:60px;border-radius:3px;display:grid;place-items:center;font:600 22px var(--font);color:var(--mut);object-fit:contain}
.card span:not(.ic){font:500 11px var(--font);color:var(--mut);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card[aria-pressed="true"] span:not(.ic){color:var(--fg);font-weight:600}
.card img.ic{filter:saturate(1.3) contrast(1.06)}
.card img.ic[src=""],.card img.ic:not([src]),.card img.ic[data-wait]{background:var(--sub)}
.row .dir{padding:8px 10px;min-width:38px}
.row .sep{flex:none;width:1px;margin:6px 4px;background:var(--sep)}
/* 알림 — 어두운 유리 캡슐(앱 토스트와 같은 판) */
#msg{position:fixed;top:calc(68px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);white-space:nowrap;padding:10px 16px;font:600 14px var(--font);color:#fff;pointer-events:none;transition:opacity .2s;--r:22px;background:rgba(26,29,38,.7);box-shadow:0 12px 32px rgba(0,0,0,.28)}
#msg:empty{opacity:0}
#hamb{display:none}
/* ── 폰: 밝은 리퀴드 글래스 + 떠 있는 하단 탭(왼쪽 둥근 메뉴 단추 60 + 캡슐 60). 모서리 30·50%는 폰 전용 부품 ── */
@media (max-width:600px){
 :root{color-scheme:light;--fill:rgba(255,255,255,.76);--blur:blur(20px) saturate(1.6);--line:rgba(16,24,40,.09);--edge:0 0 0 0 transparent;--hi:inset 0 1px 0 rgba(255,255,255,.6);--drop:0 10px 30px rgba(16,24,40,.16),0 1px 2px rgba(16,24,40,.08);
  --fg:#1C1C1E;--fg2:rgba(28,28,30,.86);--mut:rgba(60,60,67,.62);--hov:rgba(120,120,128,.14);--sub:rgba(120,120,128,.1);--on:var(--btint);--onfg:var(--b600);--sep:rgba(60,60,67,.18);
  --ind:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.35));--indsh:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(62,113,210,.12),0 2px 8px rgba(16,24,40,.12);--r:24px}
 button[aria-pressed="true"]{font-weight:600}
 #hamb{display:grid;place-items:center;position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:max(8px,calc(env(safe-area-inset-bottom,0px) - 10px));width:60px;height:60px;padding:0;border-radius:50%;color:var(--fg);transition:background .12s,color .12s,transform .18s cubic-bezier(.34,1.36,.64,1)}
 #hamb:active{transform:scale(.92)}
 body.hopen #hamb{background:linear-gradient(var(--btint),var(--btint)),var(--fill);color:var(--b600)}
 #hamb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
 #bar{left:calc(max(12px,env(safe-area-inset-left,0px)) + 68px);right:max(12px,env(safe-area-inset-right,0px));transform:none;max-width:none;height:60px;box-sizing:border-box;padding:5px;bottom:max(8px,calc(env(safe-area-inset-bottom,0px) - 10px));--r:30px;overflow:hidden}
 #barc{height:100%;gap:0}
 #bari{border-radius:25px}
 #bar .tcard{flex:1 1 0;min-width:0;width:auto;padding:2px 0 0;gap:1px;border-radius:25px;justify-content:center;color:var(--fg2)}
 #bar .tcard .ic{width:30px;height:30px}#bar .tcard span:not(.ic){font-size:11px;color:var(--mut)}
 #bar .tcard[aria-pressed="true"]{box-shadow:none}#bar .tcard[aria-pressed="true"] span:not(.ic){color:var(--b600)}
 #bar .tcard:active .ic{transform:scale(.86)}#bar .tcard .ic{transition:transform .18s cubic-bezier(.34,1.36,.64,1)}
 body:not(.hopen) #top{display:none}
 body.hopen #top{display:flex;flex-direction:column;align-items:stretch;gap:0;top:auto;right:auto;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(76px + max(8px,calc(env(safe-area-inset-bottom,0px) - 10px)));padding:6px;min-width:180px;background:var(--fill);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:22px;box-shadow:var(--hi),0 16px 48px rgba(16,24,40,.22)}
 body.hopen #top .tg{display:contents}
 body.hopen #top button{display:flex;align-items:center;gap:12px;justify-content:flex-start;padding:12px 14px;border-radius:14px;color:var(--fg)}body.hopen #top .tl{display:inline;font-weight:500}
 body.hopen #top button[aria-pressed="true"]{background:var(--btint);color:var(--b600)}
 #pick{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));transform:none;width:auto;bottom:calc(76px + max(8px,calc(env(safe-area-inset-bottom,0px) - 10px)));padding:6px}
 .card[aria-pressed="true"]{background:var(--btint);box-shadow:none}.card[aria-pressed="true"] span:not(.ic){color:var(--b600)}
 .card .sz{background:rgba(28,28,30,.55)}
 .row button{border-radius:14px}
 #cats{flex-wrap:wrap;row-gap:2px}
 #cats .sep{flex-basis:100%;width:auto;height:0;margin:0}
 .row .dir{min-width:40px;padding:8px 8px}
 .card{width:66px;border-radius:14px}.card .ic{width:50px;height:50px;border-radius:10px}.card span:not(.ic){max-width:60px}
 #env,#isl{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto}
 #env .er button,#isl .er button,#isl .slot{border-radius:14px}
 #isl{max-height:calc(100% - 200px)}
 #ctx{--r:18px}#ctx button{border-radius:12px}
 #msg{top:auto;bottom:calc(76px + max(8px,calc(env(safe-area-inset-bottom,0px) - 10px)));max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;font-size:13px;-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);border-color:transparent}
 body.pk #msg{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){#msg{transition:none}}
</style>
<div id="stars" aria-hidden="true"></div><div id="sun" aria-hidden="true"></div><div id="moon" aria-hidden="true"></div><canvas id="cv" tabindex="0" aria-label="도시"></canvas><div id="haze" aria-hidden="true"></div>
<div id="msg" class="glass" role="status">불러오는 중</div>
