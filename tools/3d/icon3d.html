{const dk=[],rl=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(!isR(x,y)||land(x,y))continue;let g=new THREE.BoxGeometry(1.02,.25,1.02);g.translate(x+.5,-.125,y+.5);dk.push(g);
